name: Build Docker Image (Fork)

# Build the Docker image of this fork and push it to the GitHub Container Registry of this repository:
#   ghcr.io/<owner>/<repo>:latest
#   ghcr.io/<owner>/<repo>:sha-<short commit sha>
# Each tag is a multi-arch image (linux/amd64 + linux/arm64), docker pull picks the right one automatically.
#
# Runs on every push to master, including "Sync fork" from the original repository in the GitHub UI.
# Note: pushes made by another workflow with GITHUB_TOKEN do not trigger this workflow, use workflow_dispatch instead.

on:
  push:
    branches:
      - master
  workflow_dispatch: # Allow manual trigger

permissions: {}

concurrency:
  group: build-docker-fork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docker-fork:
    # Only run on forks, the original repository has its own release workflows
    if: github.repository != 'louislam/uptime-kuma'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm clean-install --no-fund

      # The Dockerfile copies the frontend dist from the build context
      - name: Build frontend
        run: npm run build

      # Make sure the image starts before pushing, so a broken build does not replace "latest".
      # Only amd64 is tested, as it runs natively on the runner (arm64 would be emulated with QEMU).
      - name: Build amd64 image for smoke test
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"

          docker buildx build \
            -f docker/dockerfile \
            --platform linux/amd64 \
            --target release \
            -t uptime-kuma:smoke-test \
            --cache-from "type=registry,ref=$image:buildcache" \
            --load \
            .

      - name: Smoke test
        run: |
          docker run -d --name smoke-test -p 3001:3001 uptime-kuma:smoke-test

          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3001/; then
              echo "Uptime Kuma is up"
              docker rm -f smoke-test > /dev/null
              exit 0
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' smoke-test)" != "true" ]; then
              echo "Container stopped"
              break
            fi

            sleep 2
          done

          echo "Smoke test failed"
          docker logs smoke-test
          exit 1

      # Build both architectures into one multi-arch image (amd64 is reused from the build above)
      - name: Build and push Docker image
        run: |
          # Image names must be lowercase
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA::7}"

          docker buildx build \
            -f docker/dockerfile \
            --platform linux/amd64,linux/arm64 \
            --target release \
            -t "$image:latest" \
            -t "$image:sha-$short_sha" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --cache-from "type=registry,ref=$image:buildcache" \
            --cache-to "type=registry,ref=$image:buildcache,mode=max" \
            --push \
            .

          {
            echo "### Docker image pushed"
            echo ""
            echo "- \`$image:latest\`"
            echo "- \`$image:sha-$short_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"
